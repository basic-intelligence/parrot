[workspace]
members = [
  "src-tauri",
  "crates/parrot-protocol",
  "crates/parrot-settings",
  "crates/parrot-language",
  "crates/parrot-models",
  "crates/parrot-prompts",
  "crates/parrot-cleanup",
  "crates/parrot-paste",
  "crates/parrot-audio",
  "crates/parrot-assets",
  "crates/parrot-core-service",
  "native-core/linux",
  "native-core/windows",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.native-core-release]
inherits = "release"
opt-level = 3
