name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-macos:
    permissions:
      contents: write

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Ensure CMake is available
        run: cmake --version || brew install cmake

      - name: Install dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          CERT_ID=$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ { print $2; exit }')

          if [ -z "$CERT_ID" ]; then
            echo "Developer ID Application identity not found"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Parrot v__VERSION__"
          releaseBody: |
            Download the installer for your platform below.

            - macOS: download the `.dmg`
            - Windows: download the `-setup.exe` installer
            - Linux: download the `.AppImage` or `.deb`

            Note: Windows builds are unsigned for this release, so Windows may show an "Unknown publisher" warning.

            Existing users can update from inside Parrot.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          retryAttempts: 3
          assetNamePattern: "Parrot-[platform]-[arch][setup][ext]"
          args: --target universal-apple-darwin

  release-windows:
    permissions:
      contents: write

    runs-on: windows-latest
    needs: release-macos

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Ensure CMake is available
        run: cmake --version

      - name: Confirm Windows build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found; Visual Studio Build Tools are required."
          }

          $vsInstall = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio Desktop development with C++ tools were not found."
          }
          Write-Host "Visual Studio Build Tools: $vsInstall"

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) {
            ninja --version
          } else {
            Write-Host "Ninja is not installed; the current Windows release build does not require it."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PARROT_WINDOWS_CORE_VARIANTS: cpu,cuda
        with:
          tagName: v__VERSION__
          releaseName: "Parrot v__VERSION__"
          releaseBody: |
            Download the installer for your platform below.

            - macOS: download the `.dmg`
            - Windows: download the `-setup.exe` installer
            - Linux: download the `.AppImage` or `.deb`

            Note: Windows builds are unsigned for this release, so Windows may show an "Unknown publisher" warning.

            Existing users can update from inside Parrot.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          assetNamePattern: "Parrot-[platform]-[arch][setup][ext]"
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows.release.conf.json

  release-linux:
    permissions:
      contents: write

    runs-on: ubuntu-22.04
    needs: release-windows
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libpulse-dev \
            libasound2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            pkg-config \
            patchelf \
            libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Prepare Linux release config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.linux.conf.json", "utf8"));
          if (!process.env.TAURI_SIGNING_PRIVATE_KEY) {
            config.bundle = {
              ...config.bundle,
              createUpdaterArtifacts: false,
            };
          }
          fs.writeFileSync(
            "src-tauri/tauri.linux.release.generated.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Parrot v__VERSION__"
          releaseBody: |
            Download the installer for your platform below.

            - macOS: download the `.dmg`
            - Windows: download the `-setup.exe` installer
            - Linux: download the `.AppImage` or `.deb`

            Note: Windows builds are unsigned for this release, so Windows may show an "Unknown publisher" warning.

            Existing users can update from inside Parrot.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          retryAttempts: 3
          assetNamePattern: "Parrot-[platform]-[arch][setup][ext]"
          args: --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.release.generated.json
