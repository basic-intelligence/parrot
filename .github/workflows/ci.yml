name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libpulse-dev \
            libasound2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build Linux sidecar
        run: npm run build:core:linux

      - name: Verify Tauri Linux sidecar exists
        run: |
          sidecar="src-tauri/binaries/parrot-core-cpu-x86_64-unknown-linux-gnu"
          test -x "$sidecar"

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Run Linux sidecar tests
        run: cargo test --manifest-path native-core/linux/Cargo.toml

      - name: Build frontend
        run: npm run build:ui

      - name: Build Linux app
        run: npm run build:linux:qa

      - name: Verify Linux bundle artifacts
        run: |
          bundle_dir="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          find "$bundle_dir" -type f -name "*.AppImage" -print -quit | grep -q .
          find "$bundle_dir" -type f -name "*.deb" -print -quit | grep -q .

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Ensure CMake is available
        run: cmake --version || brew install cmake

      - name: Install dependencies
        run: npm ci

      - name: Run Swift tests
        run: swift test --package-path native-core/macos

      - name: Build frontend
        run: npm run build:ui

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Confirm Windows build tools
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc -vV
          cargo --version
          cmake --version

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found; Visual Studio Build Tools are required."
          }

          $vsInstall = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio Desktop development with C++ tools were not found."
          }
          Write-Host "Visual Studio Build Tools: $vsInstall"

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) {
            ninja --version
          } else {
            Write-Host "Ninja is not installed; the current Windows build does not require it."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows sidecar
        run: npm run build:core:windows

      - name: Verify Tauri Windows sidecar exists
        shell: pwsh
        run: |
          $sidecar = "src-tauri/binaries/parrot-core-cpu-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            throw "Missing Tauri sidecar: $sidecar"
          }

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Run Windows sidecar tests
        run: cargo test -p parrot-core --manifest-path native-core/windows/Cargo.toml

      - name: Build frontend
        run: npm run build:ui
