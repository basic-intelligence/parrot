name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libpulse-dev \
            libasound2-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            cmake \
            pkg-config \
            patchelf \
            libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build Linux sidecar
        run: npm run build:core:linux

      - name: Verify Tauri Linux sidecar exists
        run: |
          sidecar="src-tauri/binaries/parrot-core-cpu-x86_64-unknown-linux-gnu"
          test -x "$sidecar"

      - name: Run shared Rust workspace tests
        run: cargo test --workspace --exclude parrot-core-linux --exclude parrot-core

      - name: Run Linux sidecar tests
        run: cargo test --manifest-path native-core/linux/Cargo.toml

      - name: Build frontend
        run: npm run build:ui

      - name: Build Linux app
        run: npm run build:linux:qa

      - name: Verify Linux bundle artifacts
        run: |
          bundle_dir="target/x86_64-unknown-linux-gnu/release/bundle"
          if [[ ! -d "$bundle_dir" ]]; then
            bundle_dir="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          fi
          test -d "$bundle_dir"
          find "$bundle_dir" -type f -name "*.deb" -print -quit | grep -q .

      - name: Prepare Linux AppImage diagnostic config
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.linux.qa.conf.json", "utf8"));
          config.bundle = {
            ...config.bundle,
            targets: ["appimage"],
          };

          fs.writeFileSync(
            "src-tauri/tauri.linux.appimage.generated.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE

      - name: Build Linux AppImage diagnostic
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          DEBUG: "1"
        run: npm run tauri -- build --target x86_64-unknown-linux-gnu --config src-tauri/tauri.linux.appimage.generated.json --verbose

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Ensure CMake is available
        run: cmake --version || brew install cmake

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS CI Tauri config
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.macos.conf.json", "utf8"));

          config.bundle = {
            ...config.bundle,
            targets: ["app"],
            createUpdaterArtifacts: false,
          };

          config.bundle.macOS = {
            ...config.bundle.macOS,
            signingIdentity: "-",
          };

          fs.writeFileSync(
            "src-tauri/tauri.macos.ci.generated.json",
            `${JSON.stringify(config, null, 2)}\n`,
          );
          NODE

      - name: Build macOS native helper app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run build:core:mac

      - name: Verify macOS native helper app
        run: |
          helper="src-tauri/binaries/Parrot.app"

          test -d "$helper"
          test -x "$helper/Contents/MacOS/parrot-core"
          test -x "$helper/Contents/MacOS/parrot-whisper"

          codesign --verify --deep --strict --verbose=2 "$helper"

          core_archs="$(lipo -archs "$helper/Contents/MacOS/parrot-core")"
          whisper_archs="$(lipo -archs "$helper/Contents/MacOS/parrot-whisper")"

          echo "parrot-core archs: $core_archs"
          echo "parrot-whisper archs: $whisper_archs"

          [[ " $core_archs " == *" arm64 "* ]]
          [[ " $core_archs " == *" x86_64 "* ]]
          [[ " $whisper_archs " == *" arm64 "* ]]
          [[ " $whisper_archs " == *" x86_64 "* ]]

          entitlements="$(mktemp)"
          codesign -d --entitlements :- "$helper/Contents/MacOS/parrot-core" > "$entitlements" 2>/dev/null
          grep -q "com.apple.security.device.audio-input" "$entitlements"
          rm -f "$entitlements"

      - name: Run Swift tests
        run: swift test --package-path native-core/macos

      - name: Build macOS Tauri app bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target universal-apple-darwin --config src-tauri/tauri.macos.ci.generated.json --bundles app --ci

      - name: Verify macOS Tauri app bundle
        run: |
          app="target/universal-apple-darwin/release/bundle/macos/Parrot.app"

          if [[ ! -d "$app" ]]; then
            app=""
            if [[ -d "target" ]]; then
              app="$(find target -type d -path "*/bundle/macos/Parrot.app" -print -quit)"
            fi
            if [[ -z "$app" && -d "src-tauri/target" ]]; then
              app="$(find src-tauri/target -type d -path "*/bundle/macos/Parrot.app" -print -quit)"
            fi
          fi

          test -n "$app"
          test -d "$app"
          echo "Found Tauri app: $app"

          codesign --verify --deep --strict --verbose=2 "$app"

          helper="$app/Contents/Helpers/Parrot.app"
          test -d "$helper"
          test -x "$helper/Contents/MacOS/parrot-core"
          test -x "$helper/Contents/MacOS/parrot-whisper"

          codesign --verify --deep --strict --verbose=2 "$helper"

          entitlements="$(mktemp)"
          codesign -d --entitlements :- "$helper/Contents/MacOS/parrot-core" > "$entitlements" 2>/dev/null
          grep -q "com.apple.security.device.audio-input" "$entitlements"
          rm -f "$entitlements"

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Confirm Windows build tools
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc -vV
          cargo --version
          cmake --version

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found; Visual Studio Build Tools are required."
          }

          $vsInstall = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstall) {
            throw "Visual Studio Desktop development with C++ tools were not found."
          }
          Write-Host "Visual Studio Build Tools: $vsInstall"

          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($ninja) {
            ninja --version
          } else {
            Write-Host "Ninja is not installed; the current Windows build does not require it."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Windows sidecar
        run: npm run build:core:windows

      - name: Verify Tauri Windows sidecar exists
        shell: pwsh
        run: |
          $sidecars = @(
            "src-tauri/binaries/parrot-core-cpu-x86_64-pc-windows-msvc.exe",
            "src-tauri/binaries/parrot-whisper-cpu-x86_64-pc-windows-msvc.exe"
          )
          foreach ($sidecar in $sidecars) {
            if (-not (Test-Path $sidecar)) {
              throw "Missing Tauri sidecar: $sidecar"
            }
          }

      - name: Run shared Rust workspace tests
        run: cargo test --workspace --exclude parrot-core-linux --exclude parrot-core

      - name: Run Windows sidecar tests
        shell: pwsh
        run: |
          cargo test --manifest-path native-core/windows/Cargo.toml --no-default-features --features core-bin --bin parrot-core
          cargo test --manifest-path native-core/windows/Cargo.toml --no-default-features --features whisper-bin --bin parrot-whisper

      - name: Build frontend
        run: npm run build:ui
