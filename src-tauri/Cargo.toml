[package]
name = "parrot"
version = "0.1.6"
description = "Parrot"
authors = ["Parrot contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-process = "2"
parrot-language = { path = "../crates/parrot-language" }
parrot-models = { path = "../crates/parrot-models" }
parrot-protocol = { path = "../crates/parrot-protocol" }
parrot-settings = { path = "../crates/parrot-settings" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
] }
